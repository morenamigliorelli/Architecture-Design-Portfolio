<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio · Morena Migliorelli</title>
<meta name="description" content="Portfolio de arquitectura, diseño de interiores y diseño gráfico.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1d1c1a;
    --fg: #efebe4;
    --muted: #8f8a81;
    --line: #3a3834;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: Inter, system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 18px 24px 8px;
    font-size: 13px;
    letter-spacing: .06em;
    text-transform: uppercase;
  }
  header .name { font-weight: 500; }
  header .sub { color: var(--muted); }

  #stage {
    flex: 1;
    min-height: 0;
    margin: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .book { box-shadow: 0 20px 60px rgba(0,0,0,.45); }

  #loader {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    font-size: 13px;
    color: var(--muted);
    text-align: center;
    padding: 0 16px;
    transition: opacity .4s;
  }
  #loader.hidden { opacity: 0; pointer-events: none; }
  .track { width: 180px; height: 2px; background: var(--line); overflow: hidden; }
  #bar { height: 100%; width: 0; background: var(--fg); transition: width .2s; }

  footer {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 18px;
    padding: 8px 16px 18px;
    opacity: 0;
    transition: opacity .4s;
  }
  footer.visible { opacity: 1; }
  footer button {
    background: none;
    border: 1px solid var(--line);
    color: var(--fg);
    width: 38px;
    height: 38px;
    border-radius: 50%;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: border-color .2s, background .2s;
  }
  footer button:hover { border-color: var(--fg); background: rgba(255,255,255,.04); }
  footer svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.6; }
  #counter { font-size: 12px; letter-spacing: .08em; color: var(--muted); min-width: 70px; text-align: center; }

  @media (max-width: 600px) {
    header { padding: 14px 16px 4px; font-size: 11px; }
    #stage { margin: 8px 16px; }
  }
</style>
</head>
<body>

<header>
  <span class="name">Morena Migliorelli</span>
  <span class="sub">Portfolio</span>
</header>

<div id="stage">
  <div id="loader">
    <div class="track"><div id="bar"></div></div>
    <span id="loader-text">Cargando portfolio…</span>
  </div>
</div>

<footer id="controls">
  <button id="prev" aria-label="Página anterior">
    <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <span id="counter"></span>
  <button id="next" aria-label="Página siguiente">
    <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
  </button>
  <button id="fs" aria-label="Pantalla completa">
    <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  </button>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script>
  // ---- Configuración ----
  const PDF_FILE = 'portfolio.pdf';   // nombre del PDF subido junto a esta página
  const RENDER_WIDTH = 1600;          // nitidez de cada página (px)

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const stage = document.getElementById('stage');
  const loader = document.getElementById('loader');
  const loaderText = document.getElementById('loader-text');
  const bar = document.getElementById('bar');
  const controls = document.getElementById('controls');
  const counter = document.getElementById('counter');

  let images = [];
  let ratio = 0.707;
  let total = 0;
  let pageFlip = null;
  let current = 0;
  let lastSize = '';

  function canvasToUrl(canvas) {
    return new Promise(resolve => {
      canvas.toBlob(blob => resolve(URL.createObjectURL(blob)), 'image/jpeg', 0.88);
    });
  }

  async function load() {
    try {
      const pdf = await pdfjsLib.getDocument(PDF_FILE).promise;
      total = pdf.numPages;
      for (let i = 1; i <= total; i++) {
        const page = await pdf.getPage(i);
        const base = page.getViewport({ scale: 1 });
        if (i === 1) ratio = base.width / base.height;
        const vp = page.getViewport({ scale: Math.min(3, RENDER_WIDTH / base.width) });
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(vp.width);
        canvas.height = Math.round(vp.height);
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        await page.render({ canvasContext: ctx, viewport: vp }).promise;
        images.push(await canvasToUrl(canvas));
        loaderText.textContent = `Cargando página ${i} de ${total}`;
        bar.style.width = (i / total * 100) + '%';
      }
      loader.classList.add('hidden');
      controls.classList.add('visible');
      build();
    } catch (err) {
      console.error(err);
      loaderText.textContent = 'No se pudo cargar el portfolio. Revisa que "' + PDF_FILE + '" esté subido junto a esta página.';
    }
  }

  function build() {
    const r = stage.getBoundingClientRect();
    const sizeKey = Math.round(r.width) + 'x' + Math.round(r.height);
    if (pageFlip && sizeKey === lastSize) return;
    lastSize = sizeKey;

    if (pageFlip) {
      current = pageFlip.getCurrentPageIndex();
      pageFlip.destroy();
      pageFlip = null;
    }
    stage.querySelectorAll('.book').forEach(n => n.remove());

    // Una página en pantallas angostas, doble página en pantallas anchas
    const single = r.width < 700 || r.width < r.height * ratio * 1.3;
    const spread = single ? 1 : 2;
    let pageH = r.height;
    let pageW = pageH * ratio;
    if (pageW * spread > r.width) {
      pageW = r.width / spread;
      pageH = pageW / ratio;
    }
    pageW = Math.floor(pageW);
    pageH = Math.floor(pageH);

    const el = document.createElement('div');
    el.className = 'book';
    el.style.width = (pageW * spread) + 'px';
    el.style.height = pageH + 'px';
    stage.appendChild(el);

    pageFlip = new St.PageFlip(el, {
      width: pageW,
      height: pageH,
      size: 'fixed',
      showCover: true,
      usePortrait: true,
      startPage: current,
      maxShadowOpacity: 0.4,
      flippingTime: 800,
      mobileScrollSupport: false
    });
    pageFlip.loadFromImages(images);
    pageFlip.on('flip', updateCounter);
    updateCounter();
  }

  function updateCounter() {
    if (!pageFlip) return;
    counter.textContent = (pageFlip.getCurrentPageIndex() + 1) + ' / ' + total;
  }

  document.getElementById('prev').onclick = () => pageFlip && pageFlip.flipPrev();
  document.getElementById('next').onclick = () => pageFlip && pageFlip.flipNext();
  document.getElementById('fs').onclick = () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  };
  document.addEventListener('keydown', e => {
    if (!pageFlip) return;
    if (e.key === 'ArrowRight') pageFlip.flipNext();
    if (e.key === 'ArrowLeft') pageFlip.flipPrev();
  });

  let resizeTimer;
  window.addEventListener('resize', () => {
    if (!images.length) return;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(build, 250);
  });

  load();
</script>
</body>
</html>
